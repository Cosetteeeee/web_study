<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水平导航菜单</title>
    <style type="text/css">
      #nav {
        font-size: 14px;
      }
      #nav a {
        color: #ff0000;
        background-color: #99ccff;
        text-align: center;
        text-decoration: none;
        display: block;
        padding: 6px 10px 4px;
        margin: 0 2px;
        border: 1px solid #3399ff;
        float: left;
      }
      #nav a:hover {
        color: #ffffff;
        background-color: #993300;
      }
    </style>
  </head>
  <body>
    <div id="nav">
      <a href="#">首页</a>
      <a href="#">中心简介</a>
      <a href="#">政策法规</a>
      <a href="#">常用下载</a>
      <a href="#">为您服务</a>
      <a href="#">技术支持与服务</a>
    </div>
  </body>
</html>
