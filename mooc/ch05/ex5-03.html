<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>竖直导航菜单</title>
    <style type="text/css">
      #nav a {
        font-size: 14px;
        color: #333333;
        text-decoration: none;
        background-color: #cccccc;
        display: block; /*按块级元素显示*/
        width: 140px;
        padding: 6px 10px 4px;
        border: 1px solid #000000;
        margin: 2px;
      }
      #nav a:hover {
        color: #ffffff;
        background-color: #666666;
      }
    </style>
  </head>
  <body>
    <div id="nav">
      <a href="#">首页</a>
      <a href="#">学院新闻</a>
      <a href="#">教师风采</a>
      <a href="#">学生活动</a>
      <a href="#">照片欣赏</a>
    </div>
  </body>
</html>
