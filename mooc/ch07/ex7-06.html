<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript对象应用</title>
    <script type="text/JavaScript">
      var langJS = "JavaScript"; //langJS是全局变量
      test();
      function test() {
          var langVBS = "VBScript"; //langVBS是局部变量
          document.write( langJS + "1<br>");
          document.write( langVBS + "2<br>");
      }
      document.write( langJS + "3<br>" );
      document.write( langVBS + "4<br>");
    </script>
  </head>
  <body></body>
</html>
