<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>测试运算符</title>
    <script type="text/JavaScript">
      //算术运算符
      alert(3 + 5);
      alert(5 % 3);
      var i = 0;
      var j = i++;
      alert(j);
      var k = ++i;
      alert(k);
      //逻辑运算符
      alert(3 > 5);
      alert(8 < 9);
      alert(!(3 > 5));
      alert(3 > 5 && 8 < 9);
      alert(3 > 5 || 8 < 9);
      //条件运算符
      var x = 4 > 6 ? 100 : 200;
      alert(x);
      var y = 4 < 6 ? 100 : 200;
      alert(y);
    </script>
  </head>
  <body></body>
</html>
