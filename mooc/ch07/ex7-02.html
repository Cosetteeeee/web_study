<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript语法</title>
    <script type="text/JavaScript">
      var now = new Date();
      var hour = now.getHours();
      if (6 < hour && hour < 18) document.write("辛勤工作才能快乐收割！");
      else document.write("休息一下，充电后再出发。");
    </script>
  </head>
  <body></body>
</html>
