<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>行内式（内联样式表）：直接定义HTML标记中的style属性</title>
  </head>
  <body>
    <h1
      style="
        color: green;
        text-align: center;
        font-style: italic;
        font-family: 楷体;
        font-size: x-large;
      "
    >
      样式表应用结构：将样式表应用到Web页面中的四种方法之一（行内式、内联样式表）
    </h1>
  </body>
</html>
