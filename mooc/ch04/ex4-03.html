<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
  </head>
  <body>
    <form>
      name:<input type="text" /><br />
      password:<input type="password" /><br />
      gender:<input type="radio" name="genderradio" value="male" />male
      <input type="radio" name="genderradio" value="female" />female<br />
      age:<select name="ageselect">
        <option value="lt18" selected>less than 18</option>
        <option value="gt18" selected>greater than 18</option></select
      ><br />
      note:<br /><textarea cols="20" rows="5"></textarea><br />
      <input type="button" value="save" name="opbutton" />
    </form>
  </body>
</html>
