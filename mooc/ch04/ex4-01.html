<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表格标记</title>
  </head>
  <body>
    <table border="1">
      <caption>
        table-2
      </caption>
      <tr>
        <th>head1</th>
        <th>head2</th>
      </tr>
      <tr>
        <td>1-1</td>
        <td>1-2</td>
      </tr>
      <tr>
        <td>2-1</td>
        <td>2-2</td>
      </tr>
    </table>
    <table border="1">
      <tr>
        <th>姓名</th>
        <th colspan="2">电话</th>
      </tr>
      <tr>
        <td>Peter Parker</td>
        <td>555 77 854</td>
        <td>555 77 854</td>
      </tr>
    </table>
    <table border="1">
      <tr>
        <th>姓名</th>
        <td>Peter Parker</td>
      </tr>
      <tr>
        <th rowspan="2">电话</th>
        <td>555 77 854</td>
      </tr>
      <tr>
        <td>555 77 854</td>
      </tr>
    </table>
  </body>
</html>
